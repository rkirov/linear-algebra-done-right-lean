# Generated by: lake exe verso setup-literate
# To update after upgrading Verso, re-run the command above.

name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    # Allows manual deployment from the Actions tab
    workflow_dispatch:

# Permissions required for GitHub Pages deployment:
#   contents:read  — to check out the repository
#   pages:write    — to publish to GitHub Pages
#   id-token:write — for OIDC authentication with the Pages deployment API
#     (GitHub Pages uses short-lived OIDC tokens instead of long-lived secrets)
permissions:
    contents: read
    pages: write
    id-token: write

# Prevent concurrent deployments: if a new push arrives while a deployment
# is in progress, the new one waits (cancel-in-progress: false) rather than
# canceling the running deployment, which could leave the site in a broken state.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            # leanprover/lean-action handles:
            #   - Installing elan (the Lean version manager)
            #   - Reading lean-toolchain to select the right Lean version
            #   - Caching .lake for faster subsequent builds
            # We disable its default build/test since we only need :literateHtml.
            - uses: leanprover/lean-action@v1
              with:
                  build: false
                  test: false

            # Verso v4.35.0's verso-literate imports at the `.private` level, which
            # fails on `module` files ("missing data file for module …"). Apply the
            # upstream fix (leanprover/verso#1043, in v4.36). Remove after upgrading.
            - name: Patch verso-literate for the module system
              run: |
                  lake env true
                  f=.lake/packages/verso/src/verso-literate/VersoLiterateMain.lean
                  if grep -q '(loadExts := true) (arts := importArts)' "$f"; then
                      sed -i 's/(loadExts := true) (arts := importArts)/(loadExts := true) (level := (if HeaderSyntax.isModule headerStx then .server else .private)) (arts := importArts)/' "$f"
                      grep -n 'HeaderSyntax.isModule' "$f"
                  else
                      echo "verso-literate already handles modules; this step can be removed"
                  fi

            - name: Build literate site
              id: build
              run: echo "path=$(lake query :literateHtml)" >> "$GITHUB_OUTPUT"

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ${{ steps.build.outputs.path }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
